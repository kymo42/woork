name: Deploy woork to Cloudflare Workers

# woork is deployed as a static export: every route is a client component and all
# state lives in localStorage, so there is no server runtime to deploy.
#
# This workflow builds on Linux for consistency with how the output is served,
# and deploys the exported HTML/assets as a Workers static-assets site.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - ".github/workflows/deploy.yml"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "wrangler.jsonc"
      - "tailwind.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"

concurrency:
  group: deploy-woork
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the game's rules still hold
        run: npm run check:game

      - name: Build static export
        run: npm run build:cf

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --no-bundle --autoconfig=false

      - name: Report the deployed URL
        run: |
          echo "### woork deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- https://woork.0-b50.workers.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "- Game: https://woork.0-b50.workers.dev/play" >> "$GITHUB_STEP_SUMMARY"
